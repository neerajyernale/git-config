<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer"/>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" 
        crossorigin="anonymous" 
        referrerpolicy="no-referrer"/>
        <link rel="stylesheet" href="assets/style.css">
</head>

<body>

    <header class="bg-primary text-white p-4">
        <h1>Todo List</h1>
    </header>
     <div class="container-fluid">
        <div class="row">

            <div class="col-md-4 mt-4">
                <div class="card">
                    <div class="card-body">
                         <form id='todoform'>
								<div class='form-group'>
									<label for='todoitem'>Todo Item</label>
									<input type='text' class='form-control mb-3'id='todoitem'>
								</div>
								
								<div>
									<button type="submit" class="btn btn-primary w-100" id="addtodobtn">Add Todo</button>

									<button type="button" class="d-none btn btn-primary w-100" id="updatebtn">Update Todo</button>
								</div>
						</form>
                    </div>
                </div>
            </div>

            <div class="col-md-6 mt-4">
                <div class="card">
                    <div class="card-body">

                        <ul class="list-group" id="todoList"></ul>

                    </div>
                </div>
            </div>

        </div>
    </div>

    
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script> 
    <script src="assets/app.js"></script>
</body>
</html>
